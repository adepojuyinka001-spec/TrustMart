name: trustmart-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trustmart}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trustmart_dev}
      POSTGRES_DB: ${POSTGRES_DB:-trustmart_dev}
    ports:
      - "5432:5432"
    volumes:
      - trustmart_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trustmart}"]
      interval: 5s
      timeout: 5s
      retries: 10

  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: unless-stopped
    environment:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_BASIC_AUTH_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_BASIC_AUTH_PASSWORD:-changeme_dev_only}
    ports:
      - "5678:5678"
    volumes:
      - trustmart_n8n_data:/home/node/.n8n
    depends_on:
      - postgres

volumes:
  trustmart_postgres_data:
  trustmart_n8n_data:
